# This is a basic workflow to help you get started with Actions

name: Mirror to Gitlab

# Controls when the workflow will run
on:
  # Triggers the workflow on push events
  push:
    branches:
      - '**'
    tags:
      - '**'
    



# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "mirror"
  mirror:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Chekout full hisotry 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitLab config
      - name: Push mirror to GitLab
        env:
           GITLAB_TOKEN: ${{secrets.SECRET_GITLAB_TOKEN}}
           GITLAB_PROJECT: bjimeno22/coastal-watch
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git
          git push --mirror gitlab
